<script>
var SUPA_URL="https://zgliygdpbaorutzttxlr.supabase.co";
var SUPA_KEY="sb_publishable_o7z4YitotXfBKTSR67YScg_pcBRFS84";
var produk=[]; var cart=[]; var ongkirTerakhir=0;
function toast(m){ var t=document.getElementById("toast"); if(!t) return; t.textContent=m; t.style.display="block"; setTimeout(function(){ t.style.display="none"; },2000); }
function nav(p,btn){ var pages=document.querySelectorAll('.page'); for(var i=0;i<pages.length;i++) pages[i].classList.remove('active'); document.getElementById('pg-'+p).classList.add('active'); var btns=document.querySelectorAll('.nav button'); for(var j=0;j<btns.length;j++) btns[j].classList.remove('active'); if(btn) btn.classList.add('active'); if(p==='produk') tampil(); if(p==='pesanan') loadPesananBuyer(); if(p==='chat') loadChatBuyer(); if(p==='live') loadLiveBuyer(); window.scrollTo(0,0); }
// load()
function load(){
  document.getElementById("status").textContent="";
  fetch(SUPA_URL+"/rest/v1/produk?select=*&order=created_at.desc",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}})
  .then(function(r){ return r.text().then(function(tx){ return {status:r.status, txt:tx}; }); })
  .then(function(res){
    var j=[]; try{ j=JSON.parse(res.txt); }catch(e){ j=[]; }
    if(res.status!==200){ document.getElementById("status").textContent="HTTP "+res.status; produk=[]; tampil(); return; }
    if(!Array.isArray(j)){ j=[]; }
    produk=j;
    document.getElementById("status").textContent="";
    document.getElementById("count").textContent="";
    document.getElementById("statProduk").textContent=produk.length;
    var total=0; for(var i=0;i<produk.length;i++) total+=Number(produk[i].harga||0);
    document.getElementById("statNilai").textContent="Rp "+total.toLocaleString("id-ID");
    tampil();
  })
  .catch(function(e){ document.getElementById("status").textContent=e.message; });
}
// tampil()
function tampil(){
  var q=(document.getElementById("cari").value||"").toLowerCase();
  var html="";
  for(var i=0;i<produk.length;i++){
    var p=produk[i];
    if((p.nama||"").toLowerCase().indexOf(q)===-1) continue;
    var img = p.foto || p.gambar || p.image_url || "";
    var imgTag = img ? '<img src="'+img+'">' : '<div style="height:130px;background:#eee"></div>';
    html+='<div class="card2">'+imgTag+'<div class="p"><b>'+(p.nama||"")+'</b><div class="price">Rp '+Number(p.harga||0).toLocaleString("id-ID")+'</div><button onclick="beliLangsung('+p.id+')"></button><button class="hapus" onclick="tambahKeranjang('+p.id+')"></button></div></div>';
  }
  document.getElementById("grid").innerHTML=html;
  var g2=document.getElementById("grid2"); if(g2) g2.innerHTML=html;
}
function tambahKeranjang(id){ var p=null; for(var i=0;i<produk.length;i++) if(String(produk[i].id)===String(id)) p=produk[i]; if(!p) return; cart.push(p); var cn=document.getElementById("cartCountNav"); if(cn) cn.textContent=cart.length; renderCart(); }
function beliLangsung(id){ tambahKeranjang(id); var btns=document.querySelectorAll(".nav button"); nav("produk",btns[3]); }
function hapusCart(i){ cart.splice(i,1); var cn=document.getElementById("cartCountNav"); if(cn) cn.textContent=cart.length; renderCart(); }
function renderCart(){ var el=document.getElementById("cartList"); if(!el) return; if(cart.length===0){ el.innerHTML=""; var tb=document.getElementById("totalBayar"); if(tb) tb.textContent=""; return; } var h=""; var tot=0; for(var i=0;i<cart.length;i++){ tot+=Number(cart[i].harga||0); h+='<div style="border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:8px"><b>'+cart[i].nama+'</b> - Rp '+Number(cart[i].harga||0).toLocaleString("id-ID")+' <button onclick="hapusCart('+i+')">Hapus</button></div>'; } el.innerHTML=h; var tb=document.getElementById("totalBayar"); if(tb) tb.textContent="Rp "+(tot+ongkirTerakhir).toLocaleString("id-ID"); }
function pakaiOngkirManual(){ var v=Number(document.getElementById("ongkirManual").value||0); ongkirTerakhir=v; renderCart(); }
function checkout(){
  if(cart.length===0){ return; }
  var nama=(document.getElementById("namaPembeli").value||"").trim(); if(!nama){ return; }
  var tot=0; for(var i=0;i<cart.length;i++) tot+=Number(cart[i].harga||0); var grand=tot+ongkirTerakhir; var namaProduk=cart.map(function(c){return c.nama}).join(", ");
  fetch(SUPA_URL+"/rest/v1/penjualan",{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({nama_produk:namaProduk,total:grand,status:"Perlu Dikirim"})})
  .then(function(r){ return r.text().then(function(tx){ return {ok:r.ok,status:r.status,txt:tx}; }); })
  .then(function(res){
    if(res.ok){ var j=[]; try{ j=JSON.parse(res.txt); }catch(e){} cart=[]; var cn=document.getElementById("cartCountNav"); if(cn) cn.textContent=0; renderCart(); loadPesananBuyer(); var btns=document.querySelectorAll(".nav button"); nav("pesanan",btns[4]); }
    else { var ch=document.getElementById("checkoutHasil"); if(ch) ch.textContent="HTTP "+res.status; }
  });
}
function loadPesananBuyer(){ var el=document.getElementById("isiPesanan"); if(!el) return; el.innerHTML=""; fetch(SUPA_URL+"/rest/v1/penjualan?select=*&order=created_at.desc",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){ return r.text().then(function(tx){ try{ return JSON.parse(tx); }catch(e){ return []; } }); }).then(function(j){ if(!Array.isArray(j)||j.length===0){ el.innerHTML=""; var sp=document.getElementById("statPesanan"); if(sp) sp.textContent="0"; return; } var sp=document.getElementById("statPesanan"); if(sp) sp.textContent=j.length; var h=""; for(var i=0;i<j.length;i++){ h+='<div style="border:1px solid #eee;border-radius:10px;padding:10px;margin:6px 0"><b>#'+(j[i].id||"")+' - '+(j[i].nama_produk||"")+'</b><br>Rp '+Number(j[i].total||0).toLocaleString("id-ID")+' • '+(j[i].status||"")+'</div>'; } el.innerHTML=h; }); }
function loadChatBuyer(){ var el=document.getElementById("isiChatBuyer"); if(!el) return; fetch(SUPA_URL+"/rest/v1/chat_pembeli?select=*&order=created_at.desc&limit=20",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){ return r.text().then(function(tx){ try{ return JSON.parse(tx); }catch(e){ return []; } }); }).then(function(j){ if(!Array.isArray(j)||j.length===0){ el.innerHTML=""; return; } var h=""; for(var i=0;i<j.length;i++){ h+='<div style="border:1px solid #eee;border-radius:10px;padding:10px;margin:6px 0"><b>'+(j[i].nama_pembeli||"")+'</b><div>'+(j[i].pesan||"")+'</div></div>'; } el.innerHTML=h; }); }
function tambahChat(){ var nama=(document.getElementById("chatNama").value||"").trim(); var pesan=(document.getElementById("chatPesan").value||"").trim(); if(!nama||!pesan){ return; } fetch(SUPA_URL+"/rest/v1/chat_pembeli",{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({nama_pembeli:nama,pesan:pesan,status:"Untuk Dibalas Manual"})}).then(function(){ document.getElementById("chatNama").value=""; document.getElementById("chatPesan").value=""; loadChatBuyer(); }); }
function loadLiveBuyer(){ fetch(SUPA_URL+"/rest/v1/live_sesi?select=*&status=eq.live&order=created_at.desc&limit=1",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){ return r.text().then(function(tx){ try{ return JSON.parse(tx); }catch(e){ return []; } }); }).then(function(j){ var el=document.getElementById("isiLiveBuyer"); var dot=document.getElementById("liveStatusDot"); if(Array.isArray(j)&&j.length>0){ if(el) el.innerHTML='<p>'+(j[0].judul||"")+'</p>'; if(dot) dot.textContent=""; } else { if(el) el.innerHTML=""; if(dot) dot.textContent=""; } }); }
function simpanAlamatAkun(){ var a=(document.getElementById("alamatAkun").value||"").trim(); if(!a){ return; } try{ localStorage.setItem("kasap_alamat",a); }catch(e){} }
document.getElementById("cari").oninput=tampil;
load(); loadPesananBuyer(); loadChatBuyer(); loadLiveBuyer();
try{ var _n=localStorage.getItem('kasap_nama')||''; var _an=document.getElementById('akunNama'); if(_an) _an.textContent=_n; var _t=localStorage.getItem('kasap_nama_toko')||''; var _at=document.getElementById('akunToko'); if(_at) _at.textContent=_t; var _lt=document.getElementById('liveNamaToko'); if(_lt) _lt.textContent=_t||_n; }catch(e){}
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ for(var i=0;i<rs.length;i++) rs[i].unregister(); }); }
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
