  <button id="btn-beranda" onclick="nav('beranda')" class="active">🏠<br>Beranda</button>
  <button id="btn-live" onclick="nav('live')">🎥<br>Live</button>
  <button id="btn-chat" onclick="nav('chat')">💬<br>Chat</button>
  <button id="btn-keranjang" onclick="nav('keranjang')">🛒<br>Keranjang</button>
  <button id="btn-pesanan" onclick="nav('pesanan')">🔔<br>Notifikasi</button>
  <button id="btn-akun" onclick="nav('akun')">👤<br>Akun</button>

<!-- LOGIKA JAVASCRIPT UTK MEMBUAT TOMBOL AKTIF & PRODUK MUNCUL -->
<script>
  const dataProduk = [
    { id: 1, nama: "Bougenville Singapore Variegata", harga: 45000, img: "https://unsplash.com" },
    { id: 2, nama: "Bougenville Mahara Merah Tumpuk", harga: 65000, img: "https://unsplash.com" },
    { id: 3, nama: "Bougenville Citra Monduring Multiwarna", harga: 120000, img: "https://unsplash.com" },
    { id: 4, nama: "Bibit Bougenville Ungu Ekspor", harga: 25000, img: "https://unsplash.com" }
  ];

  let keranjang = [];
  let riwayatChat = [];
  let counterBelumBayar = 0;

  function nav(pageId) {
    document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
    
    const targetPage = document.getElementById('pg-' + pageId);
    const targetBtn = document.getElementById('btn-' + pageId);
    
    if(targetPage) targetPage.classList.add('active');
    if(targetBtn) targetBtn.classList.add('active');
    
    if (pageId === 'keranjang') renderCart();
  }

  function tampil() {
    const kataKunci = document.getElementById('cari') ? document.getElementById('cari').value.toLowerCase() : '';
    const grid = document.getElementById('grid');
    if (!grid) return;
    
    grid.innerHTML = '';
    const produkDisaring = dataProduk.filter(p => p.nama.toLowerCase().includes(kataKunci));
    
    if(document.getElementById('count')) {
      document.getElementById('count').innerText = `${produkDisaring.length} produk`;
    }

    if (produkDisaring.length === 0) {
      grid.innerHTML = '<p style="padding:10px;">Produk tidak ditemukan.</p>';
      return;
    }

    produkDisaring.forEach(p => {
      grid.innerHTML += `
        <div class="card">
          <img src="${p.img}" alt="${p.nama}">
          <div style="padding:6px;">
            <b>${p.nama}</b>
            <div class="price">Rp ${p.harga.toLocaleString('id-ID')}</div>
          </div>
          <button class="btn" onclick="tambahKeKeranjang(${p.id})" style="padding:6px; font-size:12px;">🛒 +Keranjang</button>
        </div>
      `;
    });
  }

  function tambahKeKeranjang(id) {
    const produk = dataProduk.find(p => p.id === id);
    const adaDiKeranjang = keranjang.find(item => item.id === id);
    if (adaDiKeranjang) { adaDiKeranjang.qty++; } else { keranjang.push({ ...produk, qty: 1 }); }
    alert(`${produk.nama} ditambahkan ke keranjang!`);
  }

  function renderCart() {
    const cartList = document.getElementById('cartList');
    if (!cartList) return;
    if (keranjang.length === 0) {
      cartList.innerHTML = '<p>Keranjang masih kosong.</p>';
      document.getElementById('totalBayar').innerText = '';
      return;
    }
    cartList.innerHTML = '';
    let subtotal = 0;
    keranjang.forEach((item, index) => {
      subtotal += item.harga * item.qty;
      cartList.innerHTML += `<div class="cart-item"><div><b>${item.nama}</b><br><span class="price">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</span></div><button onclick="hapusCart(${index})" style="background:#e53935;color:#fff;border:none;padding:4px 8px;border-radius:6px;cursor:pointer">Hapus</button></div>`;
    });
    const ongkir = parseInt(document.getElementById('kurirPilih').value) || 0;
    const metode = document.getElementById('metodeBayar').value;
    document.getElementById('bayarDetail').innerText = `Metode: ${metode}`;
    document.getElementById('hasilOngkir').innerText = `Ongkir: Rp ${ongkir.toLocaleString('id-ID')}`;
    document.getElementById('rincianBayar').innerText = `Subtotal: Rp ${subtotal.toLocaleString('id-ID')}`;
    document.getElementById('totalBayar').innerText = `Total: Rp ${(subtotal + ongkir).toLocaleString('id-ID')}`;
  }

  function hapusCart(index) { keranjang.splice(index, 1); renderCart(); }

  function checkout() {
    const kota = document.getElementById('kotaTujuan').value;
    const nama = document.getElementById('namaPembeli').value;
    if (!kota || !nama || keranjang.length === 0) { alert('Lengkapi Nama, Kota dan Keranjang!'); return; }
    counterBelumBayar++;
    if(document.getElementById('akBelum')) document.getElementById('akBelum').innerText = counterBelumBayar;
    document.getElementById('notifPesananList').innerHTML = `<div class="chat-item" style="border-left-color: #008cff"><b>Pesanan Baru</b><br>Tujuan ${kota} - a.n ${nama}.</div>`;
    document.getElementById('checkoutHasil').innerText = "Checkout Berhasil!";
    keranjang = []; renderCart();
  }

  window.addEventListener('DOMContentLoaded', () => {
    tampil();
  });
</script>
</body>
</html>
