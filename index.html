<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasap ID</title>
  <!-- Perbaikan Sistem: Menggunakan library tampilan CSS langsung yang stabil -->
  <link rel="stylesheet" href="https://jsdelivr.net">
  <script src="https://jsdelivr.net"></script>
</head>
<body>

  <!-- Header Aplikasi -->
  <header class="container">
    <h1 style="text-align: center; margin-bottom: 0;">🛒 KASAP ID ETALASE</h1>
    <p style="text-align: center; color: #00b464;">Koneksi Server Supabase Aktif</p>
  </header>

  <!-- Konten Utama -->
  <main class="container" style="max-w: 600px; margin: 0 auto;">
    
    <!-- Formulir Tambah Produk -->
    <article>
      <header><b style="color: #00b464;">📦 Tambah Produk Baru</b></header>
      <form id="fPrd">
        <label for="nm">Nama Produk
          <input type="text" id="nm" placeholder="Contoh: Minyak Goreng" required>
        </label>
        
        <label for="hg">Harga (Rp)
          <input type="number" id="hg" placeholder="0" required>
        </label>
        
        <button type="submit" style="background-color: #00b464; border: none; font-weight: bold;">
          Kirim ke Server Supabase
        </button>
      </form>
    </article>

    <!-- Daftar Produk -->
    <article>
      <header><b>📋 Produk Terpasang di Server</b></header>
      <div id="ld" style="text-align: center; color: gray;">Memuat data produk...</div>
      <div id="lst"></div>
    </article>

  </main>

  <script>
    // MASUKKAN URL & ANON KEY PROYEK SUPABASE ANDA DI SINI PATEK
    const SB_URL = "https://zgliygdpbaorutzttxlr.supabase.co";
    const SB_KEY = "sb_publishable_o7z4YitotXfBKTSR67YScg_pcBRFS84";
    
    const db = supabase.createClient(SB_URL, SB_KEY);
    const lst = document.getElementById('lst');
    const ld = document.getElementById('ld');

    // Fungsi mengambil data produk instan
    async function getPrd() {
      ld.style.display = 'block'; 
      lst.innerHTML = '';
      
      const { data, error } = await db.from('produk').select('*').order('id', { ascending: false });
      ld.style.display = 'none';
      
      if (error) {
        ld.style.display = 'block';
        ld.innerText = "Gagal memuat: " + error.message;
        return;
      }

      if (data && data.length > 0) {
        data.forEach(p => {
          lst.innerHTML += `
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding: 10px 0;">
              <span style="font-weight: 500;">${p.nama_produk}</span>
              <mark style="background-color: #e6f7ef; color: #00b464; font-weight: bold; padding: 2px 8px; rounded: 5px;">
                Rp ${Number(p.harga).toLocaleString('id-ID')}
              </mark>
            </div>`;
        });
      } else {
        lst.innerHTML = `<div style="text-align: center; color: gray; padding: 20px 0;">Belum ada produk di database patek.</div>`;
      }
    }

    // Fungsi input data produk
    document.getElementById('fPrd').addEventListener('submit', async (e) => {
      e.preventDefault();
      const n = document.getElementById('nm').value;
      const h = document.getElementById('hg').value;
      
      const { error } = await db.from('produk').insert([{ nama_produk: n, harga: parseInt(h) }]);
      if (error) {
        alert('Gagal simpan ke server: ' + error.message);
      } else {
        alert('Mantap patek! Produk berhasil masuk server.');
        document.getElementById('fPrd').reset();
        getPrd();
      }
    });

    getPrd();
  </script>
</body>
</html>
