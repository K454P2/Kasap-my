// ===== tampil() = tempat singgah produk di Beranda =====
function tampil(){
  var grid=document.getElementById('grid');
  var cnt=document.getElementById('count');
  if(!grid) return;
  var q=(document.getElementById("cari").value||"").toLowerCase();
  var list=produk.filter(function(p){ return (p.nama||"").toLowerCase().indexOf(q)!==-1; });

  if(list.length===0){ grid.innerHTML='<p style="color:#666;font-size:13px">Belum ada produk di Supa. Tambah dari Seller dulu.</p>'; return; }
  var h='';
  for(var i=0;i<list.length;i++){ var p=list[i]; h+='<div class="card"><b>'+(p.nama||"")+'</b><div class="price">Rp '+Number(p.harga||0).toLocaleString("id-ID")+'</div><div style="font-size:12px;color:#666">• Stok '+(p.stok||0)+'</div><div style="display:flex;gap:6px;margin-top:8px"><button onclick="beliLangsung('+p.id+')" style="flex:1;background:#00a651;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:800">Beli</button><button onclick="tambahKeranjang('+p.id+')" style="flex:1;background:#fff;color:#00a651;border:1px solid #00a651;padding:10px;border-radius:8px;font-weight:800">Masuk Keranjang</button></div></div>'; }

// ===== loadProduk() = LANGSUNG fetch ke Supa, tanpa dummy, tanpa timeout dummy =====
function loadProduk(){
  setText("statusSupa","● Menghubungkan ke Supa...");
  setText("count","Memuat...");
  var grid=document.getElementById('grid');
  var pesan=document.getElementById('pesanSupa');
  if(grid) grid.innerHTML='<p style="color:#666;font-size:13px">Mengambil produk langsung dari Supa...</p>';
  if(pesan) pesan.textContent='';
  fetch(SUPA_URL+"/rest/v1/produk?select=*&order=created_at.desc",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}})
  .then(function(r){ return r.text().then(function(tx){ return {status:r.status, txt:tx}; }); })
  .then(function(res){
    var j=[]; try{ j=JSON.parse(res.txt); }catch(e){ j=[]; }
    if(res.status!==200){
      setText("statusSupa","● Gagal ke Supa - HTTP "+res.status);
      if(pesan) pesan.textContent='Gagal HTTP '+res.status+'. Di Supabase jalankan: alter table produk disable row level security;';
      produk=[];
      tampil();
      return;
    }
    if(!Array.isArray(j) || j.length===0){
      setText("statusSupa","● Terhubung ke Supa - 0 produk");
      if(pesan) pesan.textContent='Supa terhubung, tapi tabel produk kosong. Tambah produk dari Seller.';
      produk=[];
      tampil();
      return;
    }
    setText("statusSupa","● Terhubung ke Supa - "+j.length+" produk");
    if(pesan) pesan.textContent='Nyambung! Produk beneran dari Supa, bukan dummy.';
    produk=j;
    tampil();
  })
  .catch(function(e){
    setText("statusSupa","● Gagal fetch: "+e.message);
    if(pesan) pesan.textContent='Fetch gak jalan: '+e.message+'. Buka dari Chrome, bukan Preview.';
    produk=[];
    tampil();
  });
}
function tesSupa(){
  var el=document.getElementById('tesHasil');
  el.textContent='Tes ke Supa...';
  fetch(SUPA_URL+"/rest/v1/produk?select=*&limit=1",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}})
  .then(function(r){ return r.text().then(function(tx){ el.textContent='HTTP '+r.status+'\n'+tx.slice(0,500)+'\n\nKalau HTTP 200 = nyambung. Kalau 401/403 = RLS / Key salah. Kalau 404 = tabel produk belum ada.'; }); })
  .catch(function(e){ el.textContent='Fetch gagal: '+e.message; });
}
