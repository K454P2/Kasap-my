<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasap ID</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100">

  <header class="bg-emerald-600 text-white p-4 shadow-md">
    <h1 class="text-xl font-bold text-center">🛒 KASAP ID ETALASE</h1>
  </header>

  <main class="container mx-auto p-4 max-w-xl">
    <!-- Form Tambah Produk -->
    <div class="bg-white p-4 rounded-xl shadow-sm mb-4">
      <h2 class="font-bold mb-3 text-emerald-700">📦 Tambah Produk Baru</h2>
      <form id="formProduk" class="space-y-3">
        <input type="text" id="namaProduk" required class="w-full p-2 border rounded-lg" placeholder="Nama Produk">
        <input type="number" id="hargaProduk" required class="w-full p-2 border rounded-lg" placeholder="Harga (Rp)">
        <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold">Kirim ke Supabase</button>
      </form>
    </div>

    <!-- Daftar Produk -->
    <div class="bg-white p-4 rounded-xl shadow-sm">
      <h2 class="font-bold mb-3 text-gray-700">📋 Produk di Server</h2>
      <div id="loading" class="text-center text-gray-400">Memuat data...</div>
      <div id="listProduk" class="space-y-2"></div>
    </div>
  </main>

  <script>
    // GANTI DENGAN URL DAN ANON KEY SUPABASE ANDA SENDIRI PATEK
    const URL_SUPABASE = "https://MASUKKAN_URL_PROYEK_ANDA.supabase.co";
    const KEY_ANON = "MASUKKAN_KUNCI_ANON_ANDA";

    const supabaseClient = supabase.createClient(URL_SUPABASE, KEY_ANON);

    // Ambil Data Produk
    async function ambilData() {
      document.getElementById('loading').style.display = 'block';
      const { data, error } = await supabaseClient.from('produk').select('*');
      document.getElementById('loading').style.display = 'none';
      
      const list = document.getElementById('listProduk');
      list.innerHTML = '';
      if(data) {
        data.forEach(p => {
          list.innerHTML += `<div class="p-3 border-b flex justify-between"><b>${p.nama_produk}</b> <span class="text-emerald-600">Rp ${p.harga}</span></div>`;
        });
      }
    }

    // Kirim Data Produk
    document.getElementById('formProduk').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('namaProduk').value;
      const harga = document.getElementById('hargaProduk').value;
      
      await supabaseClient.from('produk').insert([{ nama_produk: nama, harga: parseInt(harga) }]);
      alert('Produk berhasil terkirim!');
      document.getElementById('formProduk').reset();
      ambilData();
    });

    ambilData();
  </script>
</body>
</html>
