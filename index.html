<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASAR KITA</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100">
<div class="bg-green-600 text-white p-3"><b>🛒 PASAR KITA - Toko 1 AKTIF</b><div id="s" class="text-xs bg-yellow-300 text-black px-2 py-1 rounded-full mt-1 inline-block">Menghubungkan...</div></div>
<div class="p-3 grid grid-cols-2 gap-3" id="p"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/+esm'
const supabase = createClient("https://zgliygdpbaorutzttxlr.supabase.co","sb_publishable_o7z4YitotXfBKTSR67YScg_pcBRFS84");
const {data,error} = await supabase.from('products').select('*').eq('shop_id',1);
document.getElementById('s').textContent = error ? 'Gagal: '+error.message : `✅ ${data.length} produk LIVE`;
document.getElementById('p').innerHTML = (data||[]).map(x=>`<div class="bg-white p-3 rounded-xl"><div class="bg-green-50 h-20 rounded flex items-center justify-center">🌺</div><div class="font-bold text-sm mt-1">${x.title}</div><div class="text-red-600 font-bold">Rp${x.price}</div><div class="text-xs">shop_id=${x.shop_id} • ID ${x.id}</div></div>`).join('') || 'Belum ada produk shop_id=1';
</script></body></html>
