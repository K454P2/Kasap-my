<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KASAP ID</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f5f5}
header{background:#ee4d2d;color:#fff;padding:12px;position:sticky;top:0;z-index:10}
header b{font-size:20px}header input{width:100%;padding:10px;border:none;border-radius:8px;margin-top:8px}
.banner{background:linear-gradient(90deg,#ee4d2d,#ff7337);color:#fff;padding:16px;border-radius:12px;margin:12px}
.cat{display:flex;gap:8px;overflow:auto;padding:0 12px}.cat button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:8px 12px;border-radius:20px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden}.card img{width:100%;height:140px;object-fit:cover;background:#eee}
.card .p{padding:10px}.price{color:#ee4d2d;font-weight:800}.card button{width:100%;background:#ee4d2d;color:#fff;border:none;padding:9px;border-radius:8px;margin-top:8px}
#cartBtn{position:fixed;bottom:16px;right:16px;background:#ee4d2d;color:#fff;border:none;padding:14px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30}#panel>div{background:#fff;max-width:480px;margin:0 auto;height:100%;padding:16px;overflow:auto}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.btn{background:#ee4d2d;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-weight:700}
.btn2{background:#111;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;margin-top:8px}
</style>
</head>
<body>
<header><b>KASAP ID</b> <span id="status">⏳ Menghubungkan...</span><input id="cari" placeholder="Cari Bougenville, tanaman..."></header>
<div class="banner"><b>🌿 KASAP ID — Tanaman Hias Madura</b><br>Bougenville • Pengiriman JNE / JNT • Bayar Transfer / Doku</div>
<div class="cat"><button>🌸 Semua</button><button>🌿 Bougenville</button><button>🌱 Bibit</button><button>🪴 Pot</button></div>
<div id="grid"></div>
<button id="cartBtn" onclick="bukaCart()">🛒 Keranjang (<span id="jml">0</span>)</button>

<div id="panel"><div>
<h3>🛒 Keranjang</h3><div id="isiCart"></div>
<h3>📦 Checkout</h3>
<input id="nama" placeholder="Nama pembeli">
<input id="wa" placeholder="No WA, contoh 0812...">
<input id="alamat" placeholder="Alamat lengkap">
<input id="kota" placeholder="Kota tujuan, contoh Surabaya" value="Surabaya">
<input id="berat" type="number" value="1000" placeholder="Berat gram">
<button class="btn" onclick="cekOngkir()">1. Cek Ongkir</button>
<div id="hasilOngkir" style="margin:8px 0;font-weight:700"></div>
<button class="btn2" onclick="checkout()">2. Buat Invoice & Checkout via WA</button>
<button onclick="tutup()" style="margin-top:12px;width:100%;padding:10px">Tutup</button>
</div></div>

<script>
const SUPA_URL="https://zgliygdpbaorutzttxlr.supabase.co";
const SUPA_KEY="sb_publishable_o7z4YitotXfBKTSR67YScg_pcBRFS84";
let produk=[], cart=[];
async function load(){
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/produk?select=*&order=created_at.desc",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}});
    produk=await r.json();
    document.getElementById("status").textContent="✅ Terhubung • "+produk.length+" produk";
    tampil();
  }catch(e){document.getElementById("status").textContent="❌ Gagal, cek koneksi";}
}
function tampil(){
  const q=(document.getElementById("cari").value||"").toLowerCase();
  document.getElementById("grid").innerHTML=produk.filter(p=>p.nama.toLowerCase().includes(q)).map(p=>`
  <div class="card"><img src="https://via.placeholder.com/400x300?text=${encodeURIComponent(p.nama)}">
  <div class="p"><b>${p.nama}</b><div class="price">Rp ${Number(p.harga).toLocaleString("id-ID")}</div>
  <button onclick="tambah(${p.id})">+ Keranjang</button></div></div>`).join("")||"<p style='padding:12px'>Belum ada produk</p>";
}
function tambah(id){const p=produk.find(x=>x.id===id);cart.push(p);document.getElementById("jml").textContent=cart.length;alert(p.nama+" masuk keranjang");}
function bukaCart(){
  document.getElementById("panel").style.display="block";
  let total=cart.reduce((s,x)=>s+Number(x.harga),0);
  document.getElementById("isiCart").innerHTML=cart.map(x=>`<div>${x.nama} - Rp ${Number(x.harga).toLocaleString("id-ID")}</div>`).join("")+`<b>Total barang: Rp ${total.toLocaleString("id-ID")}</b>`;
}
function tutup(){document.getElementById("panel").style.display="none";}
let ongkirTerakhir=9000;
async function cekOngkir(){
  const kota=document.getElementById("kota").value||"Surabaya";
  const berat=Number(document.getElementById("berat").value||1000);
  document.getElementById("hasilOngkir").textContent="⏳ Menghitung ongkir...";
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/rpc/hitung_ongkir_server",{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({kota_tujuan:kota,berat_gram:berat})});
    const d=await r.json();
    ongkirTerakhir=d.ongkir||9000;
    document.getElementById("hasilOngkir").textContent="🚚 Ongkir ke "+kota+" ("+berat+"g): Rp "+Number(ongkirTerakhir).toLocaleString("id-ID")+" • "+(d.mode||"");
  }catch(e){document.getElementById("hasilOngkir").textContent="Ongkir manual: Rp 9.000 (offline)";}
}
async function checkout(){
  const nama=document.getElementById("nama").value, wa=document.getElementById("wa").value;
  if(!nama||!wa) return alert("Isi nama + WA dulu bro");
  let total=cart.reduce((s,x)=>s+Number(x.harga),0)+ongkirTerakhir;
  const inv="INV-"+Date.now();
  try{
    await fetch(SUPA_URL+"/rest/v1/rpc/buat_invoice_doku_server",{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({amount:total,invoice_id:inv})});
  }catch(e){}
  const pesan=encodeURIComponent("Halo KASAP ID, saya "+nama+" mau pesan:\n"+cart.map(x=>"- "+x.nama+" Rp "+Number(x.harga).toLocaleString("id-ID")).join("\n")+"\nOngkir: Rp "+ongkirTerakhir.toLocaleString("id-ID")+"\nTOTAL: Rp "+total.toLocaleString("id-ID")+"\nInvoice: "+inv+"\nAlamat: "+document.getElementById("alamat").value+" "+document.getElementById("kota").value);
  window.open("https://wa.me/6281234567890?text="+pesan,"_blank");
}
document.getElementById("cari").oninput=tampil;
load();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
