<header class="bg-[#00AA5B] text-white p-3 sticky top-0 z-20 shadow">
  <div class="max-w-6xl mx-auto flex items-center gap-3">

    <div class="flex-1 bg-white rounded-full flex items-center px-3 py-1.5">
      <span class="text-gray-400 text-sm">🔍</span>
      <input id="search" placeholder="Cari Bougenville, Sop Buntut..." class="flex-1 ml-2 outline-none text-black text-sm bg-transparent">
    </div>
    <div id="status" class="text-[10px] bg-white/20 px-2 py-1 rounded-full">Menunggu config.js</div>
  </div>
  <div class="max-w-6xl mx-auto mt-2 flex gap-2 text-[11px]">
    <div class="bg-white text-green-700 px-3 py-1 rounded-full font-bold">✓ Toko ID 1: Sop Enak Sumekar - AKTIF</div>
    <div class="bg-yellow-300 text-black px-3 py-1 rounded-full">Gratis Ongkir 20RB</div>
  </div>
</header>

<div class="max-w-6xl mx-auto mt-3 px-3">
  <div class="bg-gradient-to-r from-green-500 to-emerald-400 rounded-2xl p-4 text-white flex justify-between items-center">
    <div>
      <div class="font-bold text-lg">PASAR KITA SPESIAL</div>
      <div class="text-sm opacity-90">Produk asli dari Supabase shop_id=1</div>
    </div>
    <div class="text-3xl">🌺🍲</div>
  </div>
</div>

<div class="max-w-6xl mx-auto mt-4 px-3">
  <div class="flex gap-3 overflow-x-auto text-xs pb-2">
    <button onclick="setCat('Semua')" class="cat-btn bg-green-600 text-white px-4 py-2 rounded-full">Semua</button>
    <button onclick="setCat('Bunga')" class="cat-btn bg-white px-4 py-2 rounded-full">Bunga & Flora</button>
    <button onclick="setCat('Sop')" class="cat-btn bg-white px-4 py-2 rounded-full">Sop Enak</button>
    <button onclick="setCat('Sembako')" class="cat-btn bg-white px-4 py-2 rounded-full">Sembako</button>
  </div>
</div>

<div class="max-w-6xl mx-auto mt-2 px-3 pb-24">
  <div class="flex justify-between items-center mb-3">
    <h2 class="font-bold">Produk Terbaru <span id="count" class="bg-white text-green-700 text-xs px-2 py-1 rounded-full border">0</span></h2>
    <button onclick="document.getElementById('debugBox').classList.toggle('hidden')" class="text-xs text-gray-500">Debug</button>
  </div>
  <div id="debugBox" class="hidden bg-black text-green-300 text-[11px] p-3 rounded-xl mb-3 whitespace-pre-wrap"></div>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 text-[11px] z-20">

  <div class="text-center">👤<br>Akun</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/+esm'

const debugEl = document.getElementById('debugBox')
const statusEl = document.getElementById('status')
const produkEl = document.getElementById('produk')
const countEl = document.getElementById('count')

function log(m){ debugEl.textContent += m + "\n"; console.log(m) }

const URL = window.SUPABASE_URL
const KEY = window.SUPABASE_ANON_KEY

log(`[CONFIG] URL: ${URL}`)
log(`[CONFIG] KEY: ${KEY ? KEY.slice(0,35)+'... len='+KEY.length : 'KOSONG'}`)
log(`[INFO] Format key baru sb_publishable_xxx = BOLEH di frontend (sesuai pengumuman Supabase akhir 2026)`)

if (!URL || !KEY) {
  statusEl.textContent = 'config.js kosong'
  statusEl.className = 'text-[10px] bg-red-500 text-white px-2 py-1 rounded-full'
  log('[ERROR] config.js belum kebaca. Pastikan ada file config.js di folder yang sama dengan index.html')
  renderOffline()
} else {
  statusEl.textContent = 'Menghubungkan...'
  loadSupabase()
}

async function loadSupabase(){
  try {
    const supabase = createClient(URL, KEY)
    log('[SUPABASE] Client created with sb_publishable key')
    // Coba select tanpa join dulu biar gak kena RLS shops
    const { data, error, status } = await supabase.from('products').select('*').eq('shop_id', 1).limit(20).order('id', {ascending:false})
    log(`[RESPONSE] status: ${status}`)
    if (error) {
      log(`[ERROR] ${error.message} | code: ${error.code} | hint: ${error.hint || '-'}`)
      if (error.message.includes('Invalid API key')) {
        log('[SOLUSI] Key di config.js kepotong! Copy FULL dari Supabase Dashboard > Project Settings > API Keys > Publishable key')
      }
      if (error.code === '42501' || status === 401 || status === 403) {
        log('[SOLUSI] RLS nge-block! Jalankan di SQL Editor: ALTER TABLE products DISABLE ROW LEVEL SECURITY;')
      }
      statusEl.textContent = 'Offline - RLS/Key error'
      statusEl.className = 'text-[10px] bg-yellow-500 text-black px-2 py-1 rounded-full'
      renderOffline()
    } else {
      log(`[SUCCESS] Dapet ${data.length} produk dari shop_id=1`)
      statusEl.textContent = `✅ ${data.length} produk live`
      statusEl.className = 'text-[10px] bg-white text-green-700 px-2 py-1 rounded-full font-bold'
      if (data.length === 0) {
        log('[INFO] Tabel products kosong untuk shop_id=1, menampilkan dummy + produk asli ID 5 kalau ada')
        renderOffline()
      } else {
        render(data)
      }
    }
  } catch (e) {
    log(`[CATCH] ${e.message}`)
    statusEl.textContent = 'Error - offline'
    renderOffline()
  }
}

function render(items){
  countEl.textContent = items.length
  produkEl.innerHTML = items.map(p => `
    <div class="bg-white rounded-2xl p-3 shadow-sm border">
      <div class="bg-gradient-to-br from-green-50 to-pink-50 h-28 rounded-xl mb-2 flex items-center justify-center text-4xl">${(p.title||'').toLowerCase().includes('sop')?'🍲':'🌺'}</div>
      <div class="font-bold text-sm line-clamp-2 h-10">${p.title || p.name || 'Produk'}</div>
      <div class="text-red-600 font-extrabold text-sm mt-1">Rp${(p.price||0).toLocaleString('id-ID')}</div>
      <div class="text-[11px] text-gray-500 mt-1">${p.shop_name || 'Sop Enak Sumekar'} • shop_id=${p.shop_id} • Stok ${p.stock||0}</div>
      <button onclick="addCart()" class="mt-2 w-full bg-green-50 border border-green-200 text-green-700 text-xs py-2 rounded-full font-bold">+ Keranjang</button>
    </div>
  `).join('')
}

function renderOffline(){
  // Ini dummy yang mirip data asli kamu ID 5
  render([
    {id:5, title:'Bougenville Merah Merambat 80cm (Asli DB shop_id=1)', price:45000, stock:32, shop_id:1, shop_name:'Kebun Bunga Asri'},
    {id:7, title:'Sop Buntut Enak Sumekar', price:40000, stock:15, shop_id:1, shop_name:'Sop Enak Sumekar'},
    {id:8, title:'Bougenville Ungu Variegata Import', price:75000, stock:12, shop_id:1, shop_name:'Flora Cantik'},
  ])
}

let cartN=0
window.addCart = ()=>{ cartN++; document.getElementById('cart').textContent=cartN }
window.setCat = (c)=>{
  document.querySelectorAll('.cat-btn').forEach(b=>{b.className='cat-btn bg-white px-4 py-2 rounded-full'})
  event.target.className='cat-btn bg-green-600 text-white px-4 py-2 rounded-full'
  // filter simple
  renderOffline()
}
document.getElementById('search').addEventListener('input', ()=>renderOffline())
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
