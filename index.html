<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KASAP ID</title>
<style>body{margin:0;font-family:system-ui;background:#f2f2f2;padding:12px} .top{background:#00a651;color:#fff;padding:14px;border-radius:12px} .card{background:#fff;border-radius:12px;padding:12px;margin-top:12px} .price{color:#e65100;font-weight:800} input{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px} .btn{background:#00a651;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:700}</style>
</head>
<body>
<div class="top"><b>KASAP ID</b><br><span id="status">Menghubungkan...</span></div>
<div id="debug" style="background:#fff;padding:10px;margin-top:10px;border-radius:10px;font-size:13px;white-space:pre-wrap"></div>
<div id="grid"></div>
<div class="card"><h3>+ Tambah Produk</h3><input id="namaBaru" placeholder="Nama produk"><input id="hargaBaru" type="number" placeholder="Harga"><button class="btn" onclick="tambahProduk()">Simpan ke Supabase</button><p id="tambahHasil"></p></div>
<script>
var SUPA_URL="https://zgliygdpbaorutzttxlr.supabase.co";
var SUPA_KEY="sb_publishable_o7z4YitotXfBKTSR67YScg_pcBRFS84";
var produk=[];
function load(){
  document.getElementById("status").textContent="Menghubungkan ke Supabase...";
  fetch(SUPA_URL+"/rest/v1/produk?select=*&order=created_at.desc",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}})
  .then(function(r){ document.getElementById("debug").textContent="HTTP Status: "+r.status; return r.json(); })
  .then(function(j){
    document.getElementById("debug").textContent="Isi Supabase: "+JSON.stringify(j);
    if(j && j.length!==undefined){ produk=j; }
    else{ produk=[]; }
    document.getElementById("status").textContent="Terhubung - "+produk.length+" produk";
    var html="";
    for(var i=0;i<produk.length;i++){
      var p=produk[i];
      html+='<div class="card"><b>'+p.nama+'</b><div class="price">Rp '+Number(p.harga).toLocaleString("id-ID")+'</div></div>';
    }
    if(produk.length===0) html='<div class="card">Belum ada produk di tabel produk</div>';
    document.getElementById("grid").innerHTML=html;
  })
  .catch(function(e){
    document.getElementById("status").textContent="GAGAL: "+e.message;
    document.getElementById("debug").textContent="Error: "+e.message;
  });
}
function tambahProduk(){
  var nama=document.getElementById("namaBaru").value;
  var harga=Number(document.getElementById("hargaBaru").value||0);
  if(!nama||!harga){ alert("Isi nama + harga"); return; }
  document.getElementById("tambahHasil").textContent="Menyimpan...";
  fetch(SUPA_URL+"/rest/v1/produk",{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({nama:nama,harga:harga})})
  .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
  .then(function(res){
    if(res.ok){ document.getElementById("tambahHasil").textContent="Berhasil tersimpan!"; load(); }
    else{ document.getElementById("tambahHasil").textContent="Gagal: "+JSON.stringify(res.j); }
  })
  .catch(function(e){ document.getElementById("tambahHasil").textContent="Gagal: "+e.message; });
}
load();
</script>
</body>
</html>
