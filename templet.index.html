</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMPLATE - Kolom Produk (Nyambung ke Yang Pertama)</title><style>body{margin:0;font-family:sans-serif;background:#f5f5f5;padding:10px}.box{background:#fff;padding:14px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:10px}.btn{width:100%;background:#00a651;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:800;margin-top:10px}</style></head><body>
<div class="box"><b>Produk • <span id="count">Memuat...</span></b><div id="pesan" style="font-size:13px;color:#666;margin-top:6px"></div><div id="grid" class="grid" style="margin-top:10px"></div><button class="btn" onclick="loadProduk()">🔄 Muat Ulang</button></div>
<script>
// TEMPLATE ini NYAMBUNG ke yang pertama - Supabase-nya SAMA PERSIS, tabelnya SAMA (produk)
// Jadi Seller tambah produk di yang pertama -> di template ini langsung muncul juga, gak perlu input 2x
var SUPA_URL="https://zgliygdpbaorutzttxlr.supabase.co";
var SUPA_KEY="sb_publishable_o7z4YitotXfBKTSR67YScg_pcBRFS84";
function loadProduk(){
  document.getElementById('pesan').textContent='Mengambil dari Supabase yang sama...';
  fetch(SUPA_URL+"/rest/v1/produk?select=*&order=created_at.desc",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}})
  .then(function(r){return r.text().then(function(t){return {status:r.status,json:function(){try{return JSON.parse(t)}catch(e){return []}}}})})
  .then(function(res){
    var j=res.json();
    if(res.status!==200){document.getElementById('pesan').textContent='Gagal HTTP '+res.status+' - cek RLS produk di Supabase';return;}
    if(!j||j.length===0){document.getElementById('count').textContent='0 produk';document.getElementById('pesan').textContent='Tabel produk kosong di Supabase. Tambah dari Seller dulu.';document.getElementById('grid').innerHTML='';return;}
    document.getElementById('count').textContent=j.length+' produk';
    document.getElementById('pesan').textContent='Nyambung ke yang pertama - produk ketemu '+j.length;
    document.getElementById('grid').innerHTML=j.map(function(p){return '<div class="card"><b>'+(p.nama||'')+'</b><div>Rp '+Number(p.harga||0).toLocaleString('id-ID')+'</div><div style="font-size:12px;color:#666">Stok: '+(p.stok||0)+'</div></div>'}).join('');
  })
  .catch(function(e){document.getElementById('pesan').textContent='Fetch gak jalan: '+e.message;});
}
loadProduk();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.proto
