<!DOCTYPE html>
<html lang="id"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KASAP ID - Daftar / Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;padding-bottom:40px}
.top{background:#00a651;color:#fff;padding:20px;text-align:center}
.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:480px;margin:14px auto;padding:0 12px}
.tab{display:flex;gap:8px}.tab button{flex:1;border:none;padding:12px;border-radius:999px;font-weight:900;cursor:pointer}
.tab button.on{background:#00a651;color:#fff}.tab button.off{background:#fff;color:#333;border:1px solid #ddd}
.box{background:#fff;margin-top:12px;padding:16px;border-radius:14px}
.box h2{margin:0 0 10px;font-size:16px}
label{font-size:13px;font-weight:700;display:block;margin-top:10px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:6px;font-size:14px}
.btn{width:100%;background:#00a651;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:900;margin-top:14px;font-size:15px;cursor:pointer}
.btn2{width:100%;background:#fff;color:#333;border:1px solid #ddd;padding:12px;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;display:none;z-index:9999;font-size:13px;max-width:90%;text-align:center}
.role{display:flex;gap:8px;margin-top:6px}.role label{flex:1;border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:13px}
.role input{display:none}.role input:checked+span{color:#00a651;font-weight:900}
</style></head><body>
<div class="top"><h1>KASAP ID 🌸</h1></div>
<div class="wrap">
<div class="tab"><button id="tDaftar" class="on" onclick="showTab('daftar')">Daftar</button><button id="tLogin" class="off" onclick="showTab('login')">Login</button></div>

<!-- DAFTAR -->
<div id="pg-daftar" class="box"><h2>📝 Daftar Akun Baru</h2>
<label>Nama Lengkap</label><input id="dNama" placeholder="Contoh: Angkasa">
<label>Alamat Lengkap</label><input id="dAlamat" placeholder="jl. raya sumur agung, karang nangka, karang dami">
<label>No HP (WA)</label><input id="dHp" placeholder="Contoh: 081234567890" type="tel">
<label>Email</label><input id="dEmail" placeholder="Contoh: nama@gmail.com" type="email">
<label>Buat Password</label><div style="position:relative"><input id="dPass" placeholder="Minimal 6 karakter" type="password" style="padding-right:44px"><button type="button" onclick="toggleMata('dPass',this)" style="position:absolute;right:6px;top:6px;background:none;border:none;font-size:18px;cursor:pointer;padding:6px 8px">👁️</button></div>
<label>Mau masuk sebagai apa?</label>
<div class="role">
<label><input type="radio" name="role" value="buyer" checked><span>🛒 Buyer<br><small>Beli</small></span></label>
<label><input type="radio" name="role" value="seller"><span>🌸 Seller<br><small>Jualan</small></span></label>
</div>
<button class="btn" onclick="daftar()">Daftar & Langsung Masuk</button>

</div>

<!-- LOGIN -->
<div id="pg-login" class="box" style="display:none"><h2>🔑 Login</h2>
<label>Email</label><input id="lEmail" placeholder="Email yang dipakai Daftar" type="email">
<label>Password</label><div style="position:relative"><input id="lPass" placeholder="Password" type="password" style="padding-right:44px"><button type="button" onclick="toggleMata('lPass',this)" style="position:absolute;right:6px;top:6px;background:none;border:none;font-size:18px;cursor:pointer;padding:6px 8px">👁️</button></div><div style="text-align:right;margin-top:8px"><span onclick="lupaPassword()" style="color:#00a651;font-size:13px;font-weight:700;cursor:pointer">Lupa Password?</span></div>
<button class="btn" onclick="login()">Login & Masuk</button>
<button class="btn2" onclick="showTab('daftar')">Belum punya akun? Daftar dulu</button>

</div>

</div>
<div id="toast"></div>
<script>
var SUPA_URL="https://zgliygdpbaorutzttxlr.supabase.co";
var SUPA_KEY="sb_publishable_o7z4YitotXfBKTSR67YScg_pcBRFS84";
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
function showTab(w){document.getElementById('pg-daftar').style.display=w==='daftar'?'block':'none';document.getElementById('pg-login').style.display=w==='login'?'block':'none';document.getElementById('tDaftar').className=w==='daftar'?'on':'off';document.getElementById('tLogin').className=w==='login'?'on':'off'}
function getRole(){var r=document.querySelector('input[name="role"]:checked');return r?r.value:'buyer'}
function simpanLocal(u){localStorage.setItem('kasap_user',JSON.stringify(u));localStorage.setItem('kasap_nama',u.nama||'');localStorage.setItem('kasap_alamat',u.alamat||'');localStorage.setItem('kasap_hp',u.no_hp||'');localStorage.setItem('kasap_email',u.email||'');localStorage.setItem('kasap_role',u.role||'buyer')}
function goByRole(role){if(role==='seller'){location.href='https://kasap2.github.io/kasap/my/seller/'}else{location.href='https://kasap2.github.io/kasap/my/'}}
async function daftar(){
var nama=document.getElementById('dNama').value.trim(),alamat=document.getElementById('dAlamat').value.trim(),hp=document.getElementById('dHp').value.trim(),email=document.getElementById('dEmail').value.trim(),pass=document.getElementById('dPass').value,role=getRole();
if(!nama||!alamat||!hp||!email||!pass){toast('Isi semua dulu: Nama, Alamat, No HP, Email, Password');return}
if(pass.length<6){toast('Password minimal 6 karakter');return}
toast('Menyimpan...');
try{
// 1. Buat akun Auth Supabase
var r1=await fetch(SUPA_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})});
var j1=await r1.json();if(j1.error) throw new Error(j1.error.message||'Gagal Daftar Auth');
// 2. Simpan profil ke tabel pengguna (nama, alamat, no_hp, email, role)
var userId=j1.user?j1.user.id:null;
var r2=await fetch(SUPA_URL+'/rest/v1/pengguna',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({id:userId,nama:nama,alamat:alamat,no_hp:hp,email:email,role:role})});
if(!r2.ok){var t2=await r2.text();throw new Error('Gagal simpan ke tabel pengguna. Jalankan SQL pengguna dulu. '+t2.slice(0,120))}
// 3. Simpan di HP + langsung ngelink
var u={id:userId,nama:nama,alamat:alamat,no_hp:hp,email:email,role:role};
simpanLocal(u);toast('Sukses Daftar! Masuk ke '+(role==='seller'?'Seller':'Buyer')+'...');
setTimeout(function(){goByRole(role)},900);
}catch(e){toast('Gagal: '+e.message)}
}
async function login(){
var email=document.getElementById('lEmail').value.trim(),pass=document.getElementById('lPass').value;
if(!email||!pass){toast('Isi Email + Password');return}
toast('Login...');
try{
var r1=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})});
var j1=await r1.json();if(j1.error) throw new Error('Email / Password salah');
var token=j1.access_token;
// Ambil profil dari tabel pengguna
var r2=await fetch(SUPA_URL+'/rest/v1/pengguna?email=eq.'+encodeURIComponent(email)+'&select=*',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+token}});
var j2=await r2.json();var u=j2&&j2[0]?j2[0]:{nama:email.split('@')[0],alamat:'',no_hp:'',email:email,role:'buyer'};
simpanLocal(u);localStorage.setItem('kasap_token',token);
toast('Sukses Login! Masuk ke '+(u.role==='seller'?'Seller':'Buyer')+'...');
setTimeout(function(){goByRole(u.role)},900);
}catch(e){toast('Gagal: '+e.message)}
}
// Kalau sudah login, langsung tawarkan masuk
try{var s=localStorage.getItem('kasap_user');if(s){var u=JSON.parse(s);}}catch(e){}

function toggleMata(id,btn){var e=document.getElementById(id);if(!e)return;if(e.type==='password'){e.type='text';btn.textContent='🙈'}else{e.type='password';btn.textContent='👁️'}}
async function lupaPassword(){var email=document.getElementById('lEmail').value.trim();if(!email){email=prompt('Masukkan Email kamu untuk reset password:');if(!email)return}toast('Mengirim link reset ke '+email+'...');try{var r=await fetch(SUPA_URL+'/auth/v1/recover',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email})});if(!r.ok) throw new Error('Gagal kirim');toast('Cek Email kamu, link reset sudah dikirim!');}catch(e){toast('Gagal: '+e.message)}}
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
