<title>KASAP ID - Daftar / Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;padding-bottom:40px}

<div class="top"><h1>KASAP ID 🌸</h1></div>
<div class="wrap">
<div class="tab"><button id="tDaftar" class="off" onclick="showTab('daftar')">Daftar</button><button id="tLogin" class="off" onclick="showTab('login')">Login</button></div>

<!-- DAFTAR -->
<div id="pg-daftar" class="box" style="display:none"><h2>📝 Daftar Akun Baru</h2>
<label>Nama Sesuai KTP</label><input id="dNama" placeholder="Contoh: Angkasa">
<div id="boxNamaToko" style="display:block"><label>Nama Toko</label><input id="dNamaToko" placeholder="Contoh: Toko Angkasa Jaya"></div>
<label>Provinsi</label><select id="dProvinsi"><option value="">Pilih Provinsi...</option></select>
<label>Kabupaten / Kota</label><select id="dKabupaten"><option value="">Pilih Kabupaten dulu...</option></select>
<label>Kecamatan</label><select id="dKecamatan"><option value="">Pilih Kecamatan dulu...</option></select>
<label>Kelurahan / Desa</label><select id="dKelurahan"><option value="">Pilih Kelurahan dulu (boleh kosong)...</option></select>
<label>Alamat Lengkap (Nama Jalan / No Rumah)</label><input id="dAlamatDetail" placeholder="Contoh: jl. raya sumur agung">
<label>Tanggal Lahir</label><input id="dTglLahir" type="date">
<input type="hidden" id="dAlamat">
<label>No HP (WA)</label><input id="dHp" placeholder="Contoh: 081234567890" type="tel">
<label>Email</label><input id="dEmail" placeholder="Contoh: nama@gmail.com" type="email">
<label>Buat Password</label><div style="position:relative"><input id="dPass" placeholder="Minimal 6 karakter" type="password" style="padding-right:44px"><button type="button" onclick="toggleMata('dPass',this)" style="position:absolute;right:6px;top:6px;background:none;border:none;font-size:18px;cursor:pointer;padding:6px 8px">👁️</button></div>
<label>Mau masuk sebagai apa?</label>
<div class="role">
<label><input type="radio" name="role" value="buyer" checked onclick="toggleNamaToko()"><span>🛒 Buyer<br><small>Beli</small></span></label>
<label><input type="radio" name="role" value="seller" onclick="toggleNamaToko()"><span>🌸 Seller<br><small>Jualan</small></span></label>
</div>
<button class="btn" onclick="daftar()">Daftar</button>/button>

</div>

<!-- LOGIN -->
<div id="pg-login" class="box" style="display:none"><h2>🔑 Login</h2>
<label>Email</label><input id="lEmail" placeholder="Email yang dipakai Daftar" type="email">
<label>Password</label><div style="position:relative"><input id="lPass" placeholder="Password" type="password" style="padding-right:44px"><button type="button" onclick="toggleMata('lPass',this)" style="position:absolute;right:6px;top:6px;background:none;border:none;font-size:18px;cursor:pointer;padding:6px 8px">👁️</button></div><div style="text-align:right;margin-top:8px"><span onclick="lupaPassword()" style="color:#00a651;font-size:13px;font-weight:700;cursor:pointer">Lupa Password?</span></div>
<button class="btn" onclick="login()">Login & Masuk</button>
<button class="btn2" onclick="showTab('daftar')">Belum punya akun? Daftar dulu</button>

</div>

</div>
<div id="toast"></div>
<script>
var SUPA_URL="https://zgliygdpbaorutzttxlr.supabase.co";
var SUPA_KEY="sb_publishable_o7z4YitotXfBKTSR67YScg_pcBRFS84";
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
function showTab(w){document.getElementById('pg-daftar').style.display=w==='daftar'?'block':'none';document.getElementById('pg-login').style.display=w==='login'?'block':'none';document.getElementById('tDaftar').className=w==='daftar'?'on':'off';document.getElementById('tLogin').className=w==='login'?'on':'off'}
function toggleNamaToko(){document.getElementById('boxNamaToko').style.display='block'}
function getRole(){var r=document.querySelector('input[name="role"]:checked');return r?r.value:'buyer'}
function simpanLocal(u){localStorage.setItem('kasap_user',JSON.stringify(u));localStorage.setItem('kasap_nama',u.nama||'');localStorage.setItem('kasap_alamat',u.alamat||'');localStorage.setItem('kasap_hp',u.no_hp||'');localStorage.setItem('kasap_email',u.email||'');localStorage.setItem('kasap_role',u.role||'buyer');localStorage.setItem('kasap_nama_toko',u.nama_toko||'');localStorage.setItem('kasap_tgl_lahir',u.tgl_lahir||'')}
function goByRole(role){if(role==='seller'){location.href='https://k454p2.github.io/Kasap-my/seller/'}else{location.href='https://k454p2.github.io/Kasap-my/'}}
async function daftar(){
var nama=document.getElementById('dNama').value.trim(),namaToko=document.getElementById('dNamaToko')?document.getElementById('dNamaToko').value.trim():'',hp=document.getElementById('dHp').value.trim(),email=document.getElementById('dEmail').value.trim(),pass=document.getElementById('dPass').value,role=getRole();
var alamat=gabungAlamat();var tglLahir=document.getElementById('dTglLahir')?document.getElementById('dTglLahir').value:'';
if(!nama||!alamat||!hp||!email||!pass){toast('Isi semua dulu: Nama, Alamat, No HP, Email, Password');return}
if(pass.length<6){toast('Password minimal 6 karakter');return}
toast('Menyimpan...');
try{
var r1=await fetch(SUPA_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})});
var j1=await r1.json();if(j1.error) throw new Error(j1.error.message||'Gagal Daftar Auth');
var userId=j1.user?j1.user.id:null;
// FIX 2: Simpan ke tabel pengguna (biar Admin liat + Login bisa cek) + simpan ke Pengaturan (localStorage)
var r2=await fetch(SUPA_URL+'/rest/v1/pengguna',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({id:userId,nama:nama,nama_toko:namaToko,alamat:alamat,tgl_lahir:tglLahir||null,no_hp:hp,email:email,role:role})});
if(!r2.ok){var t2=await r2.text();throw new Error('Gagal simpan ke tabel pengguna. '+t2.slice(0,120))}
var u={id:userId,nama:nama,nama_toko:namaToko,alamat:alamat,tgl_lahir:tglLahir,no_hp:hp,email:email,role:role};
simpanLocal(u);
// FIX 2: Kosongin semua kolom biar tulisan gak nempel lagi
['dNama','dNamaToko','dAlamatDetail','dTglLahir','dHp','dEmail','dPass'].forEach(function(id){var e=document.getElementById(id);if(e)e.value=''});
['dProvinsi','dKabupaten','dKecamatan','dKelurahan'].forEach(function(id){var e=document.getElementById(id);if(e)e.selectedIndex=0});
document.getElementById('dAlamat').value='';
// FIX 2: Habis Daftar -> langsung ke halaman Login, JANGAN langsung masuk ke Buyer/Seller
toast('Daftar berhasil! Silakan Login dengan Email + Password yang baru dibuat.');
document.getElementById('lEmail').value=email;
document.getElementById('lPass').value='';
showTab('login');
}catch(e){toast('Gagal: '+e.message)}
}
async function login(){
var email=document.getElementById('lEmail').value.trim(),pass=document.getElementById('lPass').value;
if(!email||!pass){toast('Isi Email + Password');return}
toast('Login...');
try{
var r1=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})});
var j1=await r1.json();if(j1.error) throw new Error('Email / Password salah');
// FIX 1: Cek di tabel pengguna, kalau gak ada = belum Daftar, tolak. Jangan bikin user palsu.
var token=j1.access_token;
var r2=await fetch(SUPA_URL+'/rest/v1/pengguna?email=eq.'+encodeURIComponent(email)+'&select=*',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+token}});
var j2=await r2.json();
if(!j2||!j2[0]){
  // Belum Daftar di tabel pengguna -> jangan kasih masuk
  try{await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+token}})}catch(e){}
  localStorage.removeItem('kasap_token');localStorage.removeItem('kasap_user');
  toast('Email ini belum Daftar. Daftar dulu baru bisa Login.');
  showTab('daftar');
  document.getElementById('dEmail').value=email;
  return;
}
var u=j2[0];
simpanLocal(u);localStorage.setItem('kasap_token',token);
toast('Sukses Login! Masuk ke '+(u.role==='seller'?'Seller':'Buyer')+'...');
setTimeout(function(){goByRole(u.role)},900);
}catch(e){toast('Gagal: '+e.message)}
}
// Kalau sudah login, langsung tawarkan masuk
// FIX 1: Jangan auto-masuk. Walaupun sudah pernah Daftar, tetap harus Login dulu. Jadi tidak ada auto-redirect di sini.

async function loadProvinsi(){isiSelect('dProvinsi',PROVINSI_STATIC,'id','name');try{var r=await fetch(WIL_URL+"/provinces.json");var j=await r.json();if(j&&j.length)isiSelect('dProvinsi',j,'id','name')}catch(e){/* pakai static, tetap jalan */}}
async function loadKabupaten(){var pid=document.getElementById('dProvinsi').value;if(!pid)return;document.getElementById('dKabupaten').innerHTML='<option value="">Memuat...</option>';try{var r=await fetch(WIL_URL+"/regencies/"+pid+".json");var j=await r.json();isiSelect('dKabupaten',j,'id','name');document.getElementById('dKecamatan').innerHTML='<option value="">Pilih Kecamatan dulu...</option>';document.getElementById('dKelurahan').innerHTML='<option value="">Pilih Kelurahan dulu...</option>'}catch(e){var el=document.getElementById('dKabupaten');el.innerHTML='<option value=\"\">Pilih...</option><option value=\"manual\">Ketik manual di Alamat Lengkap</option>';}}
async function loadKecamatan(){var kid=document.getElementById('dKabupaten').value;if(!kid)return;document.getElementById('dKecamatan').innerHTML='<option value="">Memuat...</option>';try{var r=await fetch(WIL_URL+"/districts/"+kid+".json");var j=await r.json();isiSelect('dKecamatan',j,'id','name');document.getElementById('dKelurahan').innerHTML='<option value="">Pilih Kelurahan dulu...</option>'}catch(e){var el=document.getElementById('dKecamatan');el.innerHTML='<option value=\"\">Pilih...</option><option value=\"manual\">Ketik manual di Alamat Lengkap</option>';}}
async function loadKelurahan(){var did=document.getElementById('dKecamatan').value;if(!did)return;document.getElementById('dKelurahan').innerHTML='<option value="">Memuat...</option>';try{var r=await fetch(WIL_URL+"/villages/"+did+".json");var j=await r.json();isiSelect('dKelurahan',j,'id','name')}catch(e){}}
document.getElementById('dProvinsi').addEventListener('change',loadKabupaten);
document.getElementById('dKabupaten').addEventListener('change',loadKecamatan);
document.getElementById('dKecamatan').addEventListener('change',loadKelurahan);
loadProvinsi();
function gabungAlamat(){var detail=(document.getElementById('dAlamatDetail').value||'').trim();var kel=namaSelect('dKelurahan');var kec=namaSelect('dKecamatan');var kab=namaSelect('dKabupaten');var prov=namaSelect('dProvinsi');var parts=[];if(detail)parts.push(detail);if(kel&&kel!=='Pilih...')parts.push(kel);if(kec&&kec!=='Pilih...')parts.push(kec);if(kab&&kab!=='Pilih...')parts.push(kab);if(prov&&prov!=='Pilih...')parts.push(prov);var gab=parts.join(', ');document.getElementById('dAlamat').value=gab;return gab}

function toggleMata(id,btn){var e=document.getElementById(id);if(!e)return;if(e.type==='password'){e.type='text';btn.textContent='🙈'}else{e.type='password';btn.textContent='👁️'}}
async function lupaPassword(){var email=document.getElementById('lEmail').value.trim();if(!email){email=prompt('Masukkan Email kamu untuk reset password:');if(!email)return}toast('Mengirim link reset ke '+email+'...');try{var r=await fetch(SUPA_URL+'/auth/v1/recover',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email})});if(!r.ok) throw new Error('Gagal kirim');toast('Cek Email kamu, link reset sudah dikirim!');}catch(e){toast('Gagal: '+e.message)}}
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.proto
